name: MiniMap
version: 1.0
main: org.minimap.MinimapPlugin
api-version: 1.20
commands:
  minimap:
    description: Gives the player a map
    usage: /minimap
  usage:
    description: Shows available MiniMap commands
    usage: /usage
permissions:
  minimap.admin.redraw:
    description: Allows /minimap redraw
    default: op
